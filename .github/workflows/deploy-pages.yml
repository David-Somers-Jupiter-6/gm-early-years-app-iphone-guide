name: Deploy GM Early Years App iPhone Guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate the guide
        run: python3 scripts/validate_site.py
      - name: Check embedded JavaScript syntax
        run: python3 scripts/check_javascript.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare published files
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll manifest.webmanifest sw.js _site/
          cp -r icons _site/
          if [ -d preview ]; then cp -r preview _site/; fi
          if [ -d compare ]; then cp -r compare _site/; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
