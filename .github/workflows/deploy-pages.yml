name: Deploy GM Early Years App iPhone Guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate the guide
        run: python3 scripts/validate_site.py
      - name: Check embedded JavaScript syntax
        run: python3 scripts/check_javascript.py
      - name: Validate the Simple guide (live and trial)
        run: python3 scripts/validate_simple.py
      - name: Check the Simple guide's JavaScript syntax
        run: |
          python3 scripts/check_javascript.py simple/index.html
          python3 scripts/check_javascript.py simple/preview/index.html
          node --check simple/sw.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Prepare published files
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll manifest.webmanifest sw.js _site/
          cp -r icons _site/
          if [ -d preview ]; then cp -r preview _site/; fi
          if [ -d compare ]; then cp -r compare _site/; fi
          if [ -d simple ]; then cp -r simple _site/; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # GitHub sometimes has not registered the uploaded bundle yet when the deploy step looks for it
      # ("Found 0 artifact(s)" / "No artifacts named github-pages"). Wait a little, and try again if it happens.
      - name: Wait for GitHub to register the upload
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before second try
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (second try)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before third try
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - name: Deploy to GitHub Pages (third try)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
